# Konfiguracja projektu — parametry uzywane w 01_build_dataset.ipynb i
# 02_train_classifiers.ipynb. Notebooki nadal ustawiaja te wartosci
# bezposrednio w komorkach (zeby dzialaly niezaleznie w Jupyterze); ten plik
# to jedno miejsce odniesienia przy zmianie configu.

random_state: 42

data:
  target_classes: [IfcBeam, IfcSlab, IfcStair, IfcWall]
  splits: [train, test]

models:
  random_forest:
    n_estimators: 400
    max_depth: null
    class_weight: balanced
  mlp:
    hidden_layer_sizes: [64, 32]
    activation: relu
    alpha: 0.001
    max_iter: 3000
    early_stopping: true
  gradient_boosting:
    n_estimators: 200
    max_depth: 3
    learning_rate: 0.1
  logistic_regression:
    max_iter: 2000
    class_weight: balanced

hyperparameter_tuning:
  random_forest_grid:
    n_estimators: [200, 400]
    max_depth: [null, 12, 20]
    min_samples_leaf: [1, 2, 4]
  cv_folds: 5

production_model: random_forest
